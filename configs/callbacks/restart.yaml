checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: "checkpoints/${project_name}/${run_name}"
  filename : "${run_name}-warmuping-{epoch:02d}"
  monitor: "val/loss"
  mode: "min"
  save_top_k: 1

lr_monitor:
  _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: "epoch"

utils:
  _target_: src.callbacks.RichHyperparametersSummary
  title: "Hyperparameters"