# @package _global_
run_name: "test"

defaults:
  - override /data : telco-customer-churn
  - override /model : classification
  - _self_

tokenizer:
  n_bins : 8

seed_everything : 100

model:
  base_lr : 0.0005
  net:
    d_model : 32
    num_self_attn_layers : 3
    dropout_p : 0.2
    gated_attn : false
    gated_AFR : true

  criterion:
    pos_weight:
      _target_ : torch.tensor
      data : 2.5