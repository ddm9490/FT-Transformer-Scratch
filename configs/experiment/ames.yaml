# @package _global_
run_name: "best_model"

defaults:
  - override /data : ames_housing
  - override /model : regression
  - _self_

tokenizer:
  n_bins : 32

seed_everything : 100

model:
  base_lr : 0.0005
  net:
    d_model : 32
    num_self_attn_layers : 3
    dropout_p : 0.2
    gated_attn : false
    gated_AFR : true